ServerRoot "/etc/httpd"
Listen 80
Include conf.modules.d/*.conf
User apache
Group apache
ServerAdmin root@localhost
ServerName server07
ExtendedStatus On

<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/var/www/html_project3"

#<Directory "/var/www">
#    AllowOverride None
#    Require all granted
#</Directory>

<Directory "/var/www/html_project3">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>


<IfModule dir_module>
    DirectoryIndex master_project3.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

ErrorLog "logs/error_log"

LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    CustomLog "logs/access_log" combined
</IfModule>

<IfModule alias_module>
    ScriptAlias /cgi-bin/ "/var/www/cgi-bin/"

</IfModule>

<Directory "/var/www/cgi-bin">
    Options +ExecCGI
    AddHandler cgi-script .cgi
    Require all granted
</Directory>


<IfModule mpm_prefork_module>
    StartServers        12
    MinSpareServers     6
    MaxSpareServers     12
    MaxRequestWorkers   180
    ServerLimit         180
    ListenBacklog       100
</IfModule>

KeepAlive On
MaxKeepAliveRequests 50
KeepAliveTimeout 20

RequestReadTimeout header=20-40,MinRate=500 body=20-55,MinRate=500

<Location "/server-status">
    SetHandler server-status
    Require ip 192.168.50.0/24
</Location>

<Location "/server-info">
    SetHandler server-info
    Require ip 192.168.50.0/24
</Location>


<IfModule mime_module>
    TypesConfig /etc/mime.types

    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz

    AddType text/html .shtml
    AddOutputFilter INCLUDES .shtml
</IfModule>

AddDefaultCharset UTF-8

<IfModule mime_magic_module>
    MIMEMagicFile conf/magic
</IfModule>

EnableSendfile on

IncludeOptional conf.d/*.conf
